# XploitVerse Development Stack
# Usage: docker compose up -d
# Then run the Go backend and Vite dev server locally.

services:
  # ── PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: xv-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: xploitverse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d xploitverse']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: xv-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB (for Express branch compatibility) ───────────────────
  # mongodb:
  #   image: mongo:6
  #   container_name: xv-mongodb
  #   restart: unless-stopped
  #   ports:
  #     - '27017:27017'
  #   volumes:
  #     - mongodb_data:/data/db
  #   healthcheck:
  #     test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  # mongodb_data:
  #   driver: local

# ── Lab Network (created separately by DockerService) ────────────
# The xploitverse-labs network (172.30.0.0/16) is created by the
# Go backend's DockerService.ensureNetwork() at startup.
# Lab containers are attached to that network, NOT this compose stack.
