apiVersion: v1
kind: ConfigMap
metadata:
  name: xploitverse-backend-config
  namespace: xploitverse
  labels:
    app.kubernetes.io/name: xploitverse-backend
    app.kubernetes.io/component: backend
data:
  PORT: "5000"
  NODE_ENV: "production"
  GIN_MODE: "release"
  JWT_EXPIRES_IN: "7d"
  JWT_COOKIE_EXPIRES_IN: "7"
  AWS_REGION: "us-east-1"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_FROM_NAME: "XploitVerse"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: xploitverse-client-config
  namespace: xploitverse
  labels:
    app.kubernetes.io/name: xploitverse-client
    app.kubernetes.io/component: frontend
data:
  BACKEND_SERVICE_HOST: "xploitverse-backend"
  BACKEND_SERVICE_PORT: "5000"
