apiVersion: apps/v1
kind: Deployment
metadata:
  name: xploitverse-backend
  namespace: xploitverse
  labels:
    app.kubernetes.io/name: xploitverse-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: xploitverse
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: xploitverse-backend
      app.kubernetes.io/component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xploitverse-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: xploitverse
    spec:
      serviceAccountName: xploitverse-backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: REGISTRY/xploitverse-backend:TAG
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: xploitverse-backend-config
                  key: PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: xploitverse-backend-config
                  key: NODE_ENV
            - name: GIN_MODE
              valueFrom:
                configMapKeyRef:
                  name: xploitverse-backend-config
                  key: GIN_MODE
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: xploitverse-backend-config
                  key: JWT_EXPIRES_IN
            - name: JWT_COOKIE_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: xploitverse-backend-config
                  key: JWT_COOKIE_EXPIRES_IN
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: xploitverse-backend-config
                  key: AWS_REGION
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: xploitverse-backend-config
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: xploitverse-backend-config
                  key: SMTP_PORT
            - name: SMTP_FROM_NAME
              valueFrom:
                configMapKeyRef:
                  name: xploitverse-backend-config
                  key: SMTP_FROM_NAME
            - name: POSTGRES_URI
              valueFrom:
                secretKeyRef:
                  name: xploitverse-backend-secrets
                  key: POSTGRES_URI
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: xploitverse-backend-secrets
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: xploitverse-backend-secrets
                  key: JWT_SECRET
            - name: CLIENT_URL
              valueFrom:
                secretKeyRef:
                  name: xploitverse-backend-secrets
                  key: CLIENT_URL
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: xploitverse-backend-secrets
                  key: SMTP_USERNAME
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: xploitverse-backend-secrets
                  key: SMTP_PASSWORD
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: xploitverse-backend-secrets
                  key: SMTP_FROM
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xploitverse-client
  namespace: xploitverse
  labels:
    app.kubernetes.io/name: xploitverse-client
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: xploitverse
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: xploitverse-client
      app.kubernetes.io/component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xploitverse-client
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: xploitverse
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: client
          image: REGISTRY/xploitverse-client:TAG
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
