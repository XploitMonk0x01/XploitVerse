apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xploitverse
  namespace: xploitverse
  labels:
    app.kubernetes.io/name: xploitverse
    app.kubernetes.io/part-of: xploitverse
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: REPLACE_WITH_DOMAIN
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: xploitverse-backend
                port:
                  name: http
          - path: /ws/
            pathType: Prefix
            backend:
              service:
                name: xploitverse-backend
                port:
                  name: http
          - path: /health
            pathType: Exact
            backend:
              service:
                name: xploitverse-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xploitverse-client
                port:
                  name: http
