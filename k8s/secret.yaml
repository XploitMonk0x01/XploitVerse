apiVersion: v1
kind: Secret
metadata:
  name: xploitverse-backend-secrets
  namespace: xploitverse
  labels:
    app.kubernetes.io/name: xploitverse-backend
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  POSTGRES_URI: "REPLACE_WITH_POSTGRES_URI"
  REDIS_URL: "REPLACE_WITH_REDIS_URL"
  JWT_SECRET: "REPLACE_WITH_JWT_SECRET"
  CLIENT_URL: "REPLACE_WITH_CLIENT_URL"
  SMTP_USERNAME: "REPLACE_WITH_SMTP_USERNAME"
  SMTP_PASSWORD: "REPLACE_WITH_SMTP_PASSWORD"
  SMTP_FROM: "REPLACE_WITH_SMTP_FROM"
  RAZORPAY_KEY_ID: "REPLACE_WITH_RAZORPAY_KEY_ID"
  RAZORPAY_KEY_SECRET: "REPLACE_WITH_RAZORPAY_KEY_SECRET"
